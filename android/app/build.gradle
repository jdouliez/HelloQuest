plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.helloquest'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.helloquest'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '0.18.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['mp3']
    }

    lint {
        abortOnError true
    }
}

dependencies {
    implementation 'androidx.media:media:1.7.1'
}

tasks.register('syncContent', Copy) {
    from('../../content/dialogues-poc.json')
    from('../../content/lesson-photos.json')
    from('../../content/photo-credits.json')
    into('src/main/assets')
}
preBuild.dependsOn syncContent
