plugins {
    id 'com.android.application'
}

def uploadKeyProperties = new Properties()
def uploadKeyFile = new File(System.getProperty('user.home'), '.config/helloquest-play/signing.properties')
if (uploadKeyFile.isFile()) {
    uploadKeyFile.withInputStream { uploadKeyProperties.load(it) }
}

android {
    namespace 'fr.helloquest'
    compileSdk 36

    defaultConfig {
        applicationId 'fr.helloquest'
        minSdk 26
        targetSdk 36
        versionCode 19
        versionName '0.19.0'
    }

    signingConfigs {
        if (!uploadKeyProperties.isEmpty()) {
            release {
                storeFile file(uploadKeyProperties['storeFile'])
                storePassword uploadKeyProperties['storePassword']
                keyAlias uploadKeyProperties['keyAlias']
                keyPassword uploadKeyProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (!uploadKeyProperties.isEmpty()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['mp3']
    }

    lint {
        abortOnError true
    }

    assetPacks = [':audio_pack']

    sourceSets {
        debug {
            assets.srcDirs += ['../audio_pack/src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.media:media:1.7.1'
}

tasks.register('syncContent', Copy) {
    from('../../content/dialogues-poc.json')
    from('../../content/lesson-photos.json')
    from('../../content/photo-credits.json')
    into('src/main/assets')
}
preBuild.dependsOn syncContent
